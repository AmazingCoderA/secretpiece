<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="SecretPiece — encrypted vault in a single file">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.5" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#131a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fefff"/>
      <stop offset="0.5" stop-color="#6ea8ff"/>
      <stop offset="1" stop-color="#b28cff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0a101d"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4de8ff"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4de8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.14" cy="0.28" r="0.45">
      <stop offset="0" stop-color="#4de8ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4de8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.78" cy="0.18" r="0.5">
      <stop offset="0" stop-color="#9b6bff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.62" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#4de8ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4de8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#9dbcff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blurS"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1600" height="560" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="30" fill="url(#grid)"/>
  <rect width="1600" height="560" rx="30" fill="url(#glowA)"/>
  <rect width="1600" height="560" rx="30" fill="url(#glowB)"/>
  <rect width="1600" height="560" rx="30" fill="url(#glowC)"/>
  <rect x="1" y="1" width="1598" height="558" rx="30" fill="none" stroke="#2a3d63" stroke-opacity="0.7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
    <!-- logo mark -->
    <g transform="translate(80 92)">
      <rect x="0" y="0" width="76" height="76" rx="20" fill="url(#mark)" opacity="0.16"/>
      <rect x="0" y="0" width="76" height="76" rx="20" fill="none" stroke="url(#mark)" stroke-width="1.6"/>
      <circle cx="38" cy="38" r="19" fill="none" stroke="#bfe9ff" stroke-width="2.4" opacity="0.85"/>
      <circle cx="38" cy="38" r="5.4" fill="#9feaff"/>
      <g stroke="#9feaff" stroke-width="2.4" opacity="0.85">
        <path d="M38 19v7"/><path d="M38 50v7"/><path d="M19 38h7"/><path d="M50 38h7"/>
      </g>
    </g>

    <!-- wordmark -->
    <text x="184" y="146" font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#accent)">SecretPiece</text>
    <text x="184" y="182" font-size="21" font-weight="600" fill="#8ea3c8" letter-spacing="0.4">Your secret, in pieces.</text>

    <text x="80" y="256" font-size="25" font-weight="700" fill="#e8f0ff">Зашифрованный сейф в обычном файле</text>
    <text x="80" y="290" font-size="17" fill="#8ea3c8">USB · HDD · SSD · SMB/NFS — без разметки диска, драйверов и прав администратора.</text>

    <!-- feature chips -->
    <g font-size="14.5" font-weight="600">
      <rect x="80" y="322" width="214" height="38" rx="19" fill="#4de8ff" fill-opacity="0.09" stroke="#4de8ff" stroke-opacity="0.28"/>
      <text x="187" y="347" fill="#9feaff" text-anchor="middle">XChaCha20-Poly1305</text>

      <rect x="306" y="322" width="172" height="38" rx="19" fill="#9b6bff" fill-opacity="0.11" stroke="#9b6bff" stroke-opacity="0.34"/>
      <text x="392" y="347" fill="#c9b4ff" text-anchor="middle">Hidden volume</text>

      <rect x="490" y="322" width="150" height="38" rx="19" fill="#6ea8ff" fill-opacity="0.09" stroke="#6ea8ff" stroke-opacity="0.28"/>
      <text x="565" y="347" fill="#a9c8ff" text-anchor="middle">RU / EN</text>

      <rect x="652" y="322" width="154" height="38" rx="19" fill="#2ea043" fill-opacity="0.10" stroke="#2ea043" stroke-opacity="0.34"/>
      <text x="729" y="347" fill="#8ce6a1" text-anchor="middle">GPL-3.0</text>
    </g>

    <!-- platform row -->
    <g font-size="13" font-weight="600" letter-spacing="0.3">
      <text x="80" y="452" fill="#6f84a8">WINDOWS x64 · ARM64</text>
      <text x="264" y="452" fill="#6f84a8">macOS universal</text>
      <text x="412" y="452" fill="#6f84a8">LINUX x64 · ARM64</text>
      <text x="580" y="452" fill="#6f84a8">ARCH · FREEBSD · OPENBSD · NETBSD</text>
    </g>
    <rect x="80" y="472" width="760" height="1" fill="#243655"/>

    <g font-size="13" font-weight="600">
      <rect x="80" y="492" width="118" height="30" rx="15" fill="#101a2e" stroke="#2b3f63"/>
      <text x="139" y="512" fill="#9fb4d8" text-anchor="middle">sp · secretpiece</text>
      <rect x="208" y="492" width="128" height="30" rx="15" fill="#101a2e" stroke="#2b3f63"/>
      <text x="272" y="512" fill="#9fb4d8" text-anchor="middle">one file</text>
      <rect x="346" y="492" width="150" height="30" rx="15" fill="#101a2e" stroke="#2b3f63"/>
      <text x="421" y="512" fill="#9fb4d8" text-anchor="middle">no admin rights</text>
    </g>

    <!-- terminal window -->
    <g transform="translate(880 86)">
      <rect x="0" y="0" width="640" height="392" rx="20" fill="url(#term)" stroke="#26395c" stroke-width="1.4"/>
      <rect x="0" y="0" width="640" height="46" rx="20" fill="#0e1728"/>
      <rect x="0" y="26" width="640" height="20" fill="#0e1728"/>
      <circle cx="26" cy="23" r="6" fill="#ff5f57"/>
      <circle cx="48" cy="23" r="6" fill="#febc2e"/>
      <circle cx="70" cy="23" r="6" fill="#28c840"/>
      <text x="320" y="28" font-size="13" fill="#6f84a8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sp — SecretPiece</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">
        <text x="28" y="86" fill="#5be37f">$</text>
        <text x="48" y="86" fill="#dbe6ff">sp init vault.spv --size 8G --hidden 2G</text>

        <text x="28" y="120" fill="#5be37f">✔</text>
        <text x="48" y="120" fill="#9fb4d8">container created</text>
        <text x="486" y="120" fill="#8ce6a1">vault.spv</text>

        <text x="28" y="148" fill="#5be37f">✔</text>
        <text x="48" y="148" fill="#9fb4d8">outer volume</text>
        <text x="486" y="148" fill="#9feaff">5.9 GiB</text>

        <text x="28" y="176" fill="#5be37f">✔</text>
        <text x="48" y="176" fill="#9fb4d8">hidden volume</text>
        <text x="486" y="176" fill="#c9b4ff">1.9 GiB</text>

        <text x="28" y="204" fill="#5be37f">✔</text>
        <text x="48" y="204" fill="#9fb4d8">argon2id · xchacha20 · blake3</text>
        <text x="486" y="204" fill="#8ce6a1">ready</text>

        <text x="28" y="248" fill="#5be37f">$</text>
        <text x="48" y="248" fill="#dbe6ff">sp shell vault.spv</text>

        <text x="28" y="282" fill="#6ea8ff">sp&gt;</text>
        <text x="76" y="282" fill="#dbe6ff">put ./Documents docs/</text>

        <text x="28" y="310" fill="#6ea8ff">sp&gt;</text>
        <text x="76" y="310" fill="#dbe6ff">get docs/report.pdf ./report.pdf</text>

        <text x="28" y="338" fill="#6ea8ff">sp&gt;</text>
        <text x="76" y="338" fill="#dbe6ff">snapshot create before-trip</text>

        <text x="28" y="366" fill="#6ea8ff">sp&gt;</text>
        <text x="76" y="366" fill="#5be37f">lock</text>
      </g>

      <!-- glow edge -->
      <rect x="0" y="0" width="640" height="392" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.2" opacity="0.55"/>
    </g>

    <!-- floating vault shard decoration -->
    <g opacity="0.9">
      <rect x="800" y="140" width="46" height="46" rx="12" fill="#101a2e" stroke="#3a5482"/>
      <rect x="816" y="156" width="14" height="14" rx="3" fill="none" stroke="#9feaff" stroke-width="1.6"/>
      <circle cx="823" cy="163" r="2.4" fill="#9feaff"/>
    </g>
  </g>
</svg>
