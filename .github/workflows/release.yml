name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-musl
            targets: x86_64-unknown-linux-musl
            ext: ""
            archive: tar.gz
          - os: macos-latest
            platform: macos-universal
            target: universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            ext: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.target }}" = "universal" ]; then
            cargo build --release --locked -p sp-cli --target aarch64-apple-darwin
            cargo build --release --locked -p sp-cli --target x86_64-apple-darwin
            lipo -create -output dist/sp \
              target/aarch64-apple-darwin/release/sp \
              target/x86_64-apple-darwin/release/sp
            lipo -create -output dist/secretpiece \
              target/aarch64-apple-darwin/release/secretpiece \
              target/x86_64-apple-darwin/release/secretpiece
          else
            cargo build --release --locked -p sp-cli --target ${{ matrix.target }}
            cp "target/${{ matrix.target }}/release/sp${{ matrix.ext }}" dist/
            cp "target/${{ matrix.target }}/release/secretpiece${{ matrix.ext }}" dist/
          fi

      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          name="secretpiece-${version}-${{ matrix.platform }}"
          mkdir -p "package/${name}"
          cp dist/* "package/${name}/"
          cp README.md README.en.md LICENSE CHANGELOG.md "package/${name}/"
          echo "PACKAGE_NAME=${name}" >> "$GITHUB_ENV"

      - name: Archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "package/$env:PACKAGE_NAME/*" -DestinationPath "package/$env:PACKAGE_NAME.zip"

      - name: Archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf "package/${{ env.PACKAGE_NAME }}.tar.gz" -C package "${{ env.PACKAGE_NAME }}"

      - uses: actions/upload-artifact@v4
        with:
          name: secretpiece-${{ matrix.platform }}
          path: |
            package/*.zip
            package/*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" dist/* --clobber
          else
            args=(--title "SecretPiece ${tag}" --generate-notes)
            if [[ "$tag" == v0.* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$tag" -R "$GITHUB_REPOSITORY" dist/* "${args[@]}"
          fi
