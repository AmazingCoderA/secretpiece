name: Bug report
description: Report a functional bug (not a security vulnerability)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** See [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "v0.1.0 or commit hash"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and filesystem
      placeholder: "Windows 11, exFAT USB drive"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Never include passwords, recovery words, keys, or real vault contents.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove paths, file names, and any secret material.
    validations:
      required: false
