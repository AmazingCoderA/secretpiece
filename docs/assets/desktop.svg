<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="SecretPiece desktop app: creating a vault with Argon2id choice and file disguise">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.55" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#131a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a26"/>
      <stop offset="1" stop-color="#0d121a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#9dbcff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="720" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="720" rx="28" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
    <text x="60" y="58" font-size="13" font-weight="700" letter-spacing="3.4" fill="#6f84a8">DESKTOP · EGUI</text>
    <text x="60" y="92" font-size="24" font-weight="700" fill="#e8f0ff">Создание сейфа на ПК</text>
    <text x="60" y="120" font-size="14" fill="#8ea3c8">Любое имя файла · Argon2id 16/64/256 МиБ · Windows / macOS / Linux</text>

    <!-- window -->
    <g transform="translate(70 140)">
      <rect x="0" y="0" width="1060" height="560" rx="20" fill="#080b10" stroke="#22304a" stroke-width="2"/>
      <rect x="0" y="0" width="1060" height="42" rx="20" fill="#0d121a"/>
      <rect x="0" y="21" width="1060" height="21" fill="#0d121a"/>
      <line x1="0" y1="42" x2="1060" y2="42" stroke="#1b2740"/>
      <circle cx="26" cy="21" r="6" fill="#ff5f57"/>
      <circle cx="46" cy="21" r="6" fill="#febc2e"/>
      <circle cx="66" cy="21" r="6" fill="#28c840"/>
      <text x="530" y="26" font-size="11" fill="#6f84a8" text-anchor="middle">SecretPiece</text>

      <!-- app header -->
      <text x="40" y="82" font-size="21" font-weight="800" fill="#e8f0ff">SecretPiece</text>
      <text x="40" y="100" font-size="10.5" fill="#8ea3c8">зашифрованное хранилище · один файл .spv</text>
      <rect x="952" y="66" width="66" height="28" rx="8" fill="#131a26" stroke="#22304a"/>
      <text x="985" y="85" font-size="11" font-weight="700" fill="#e8f0ff" text-anchor="middle">RU / EN</text>
      <rect x="40" y="114" width="980" height="2" fill="url(#accent)"/>

      <!-- hero -->
      <g transform="translate(40 150)">
        <rect x="0" y="0" width="58" height="58" rx="16" fill="#0d121a"/>
        <rect x="0" y="0" width="58" height="3" rx="1.5" fill="url(#accent)"/>
        <text x="29" y="37" font-size="20" font-weight="800" fill="#22d3ee" text-anchor="middle">SP</text>

        <text x="0" y="96" font-size="25" font-weight="800" fill="#e8f0ff">SecretPiece</text>
        <text x="0" y="116" font-size="12.5" fill="#8ea3c8">Ваш секрет — в кусочках.</text>

        <g font-size="12" fill="#8ea3c8">
          <circle cx="4" cy="150" r="2.6" fill="#22d3ee"/>
          <text x="18" y="154">Один обычный файл, без разметки диска</text>
          <circle cx="4" cy="178" r="2.6" fill="#a78bfa"/>
          <text x="18" y="182">Argon2id · XChaCha20-Poly1305 · BLAKE3</text>
          <circle cx="4" cy="206" r="2.6" fill="#22d3ee"/>
          <text x="18" y="210">Флешка, HDD/SSD, сетевая папка</text>
          <circle cx="4" cy="234" r="2.6" fill="#a78bfa"/>
          <text x="18" y="238">Windows · macOS · Linux · Android</text>
        </g>

        <rect x="0" y="268" width="106" height="26" rx="9" fill="#0d121a" stroke="#22304a"/>
        <text x="12" y="285" font-size="10.5" fill="#22d3ee" font-family="ui-monospace, Menlo, Consolas, monospace">v1.5 · SPV1</text>
      </g>

      <!-- form card -->
      <g transform="translate(430 150)">
        <rect x="0" y="0" width="590" height="390" rx="20" fill="url(#card)" stroke="#22304a"/>
        <text x="28" y="38" font-size="20" font-weight="800" fill="#e8f0ff">Новое хранилище</text>
        <text x="28" y="58" font-size="11" fill="#8ea3c8">Пароль не покидает это устройство · Argon2id</text>

        <text x="28" y="88" font-size="10.5" fill="#8ea3c8">Файл хранилища</text>
        <rect x="28" y="96" width="430" height="34" rx="9" fill="#0a0e14" stroke="#22304a"/>
        <text x="42" y="118" font-size="12" fill="#e8f0ff" font-family="ui-monospace, Menlo, Consolas, monospace">D:\vaults\Бермалдинки.mp3</text>
        <rect x="466" y="96" width="96" height="34" rx="9" fill="#131a26" stroke="#22304a"/>
        <text x="514" y="118" font-size="11" fill="#e8f0ff" text-anchor="middle">Обзор…</text>
        <text x="28" y="148" font-size="9.5" fill="#6f84a8">Любой файл: .spv, .bin, .mp3 — внутри всё равно контейнер SPV1.</text>

        <text x="28" y="172" font-size="10.5" fill="#8ea3c8">Оболочка:</text>
        <rect x="88" y="156" width="52" height="24" rx="7" fill="#22d3ee"/>
        <text x="114" y="172" font-size="10.5" font-weight="700" fill="#080b10" text-anchor="middle">.spv</text>
        <rect x="148" y="156" width="52" height="24" rx="7" fill="#131a26" stroke="#22304a"/>
        <text x="174" y="172" font-size="10.5" fill="#6f84a8" text-anchor="middle">.bin</text>
        <rect x="208" y="156" width="52" height="24" rx="7" fill="#22d3ee"/>
        <text x="234" y="172" font-size="10.5" font-weight="700" fill="#080b10" text-anchor="middle">.mp3</text>
        <rect x="268" y="156" width="52" height="24" rx="7" fill="#131a26" stroke="#22304a"/>
        <text x="294" y="172" font-size="10.5" fill="#6f84a8" text-anchor="middle">.jpg</text>

        <text x="28" y="202" font-size="10.5" fill="#8ea3c8">Пароль</text>
        <rect x="28" y="210" width="430" height="34" rx="9" fill="#0a0e14" stroke="#22304a"/>
        <text x="42" y="232" font-size="12" fill="#e8f0ff">••••••••••••••</text>
        <rect x="466" y="210" width="96" height="34" rx="9" fill="#0d121a" stroke="#22304a"/>
        <text x="514" y="232" font-size="10.5" fill="#8ea3c8" text-anchor="middle">Показать</text>

        <rect x="28" y="254" width="534" height="6" rx="3" fill="#18202e"/>
        <rect x="28" y="254" width="400" height="6" rx="3" fill="#4ade80"/>
        <text x="28" y="274" font-size="10" fill="#4ade80">Хороший пароль</text>

        <text x="28" y="298" font-size="10.5" fill="#8ea3c8">Стойкость ключа</text>
        <rect x="150" y="282" width="126" height="28" rx="8" fill="#0d121a" stroke="#22304a"/>
        <text x="213" y="300" font-size="11" fill="#e8f0ff" text-anchor="middle">Быстро</text>
        <rect x="284" y="282" width="126" height="28" rx="8" fill="#22d3ee"/>
        <text x="347" y="300" font-size="11" font-weight="700" fill="#080b10" text-anchor="middle">Стандарт</text>
        <rect x="418" y="282" width="126" height="28" rx="8" fill="#0d121a" stroke="#22304a"/>
        <text x="481" y="300" font-size="11" fill="#e8f0ff" text-anchor="middle">Параноид</text>
        <text x="28" y="326" font-size="9.5" fill="#6f84a8">64 МиБ · рекомендуется</text>

        <rect x="28" y="338" width="534" height="42" rx="10" fill="url(#accent)"/>
        <text x="295" y="365" font-size="14" font-weight="800" fill="#080b10" text-anchor="middle">Создать сейф</text>
      </g>
    </g>

    <text x="600" y="700" font-size="12" fill="#6f84a8" text-anchor="middle">любое расширение · проводник показывает все файлы · SPV1 внутри</text>
  </g>
</svg>
