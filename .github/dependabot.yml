version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      crypto:
        patterns:
          - "argon2"
          - "chacha20poly1305"
          - "hkdf"
          - "sha2"
          - "blake3"
          - "x25519-dalek"
          - "ed25519-dalek"
          - "subtle"
          - "zeroize"
          - "getrandom"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
