<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="SecretPiece desktop app: theme bar, unlock card and in-vault preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="0.6" stop-color="#0a1119"/>
      <stop offset="1" stop-color="#120f22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#131a26"/>
      <stop offset="1" stop-color="#0e141d"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="720" rx="26" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
    <text x="60" y="52" font-size="12.5" font-weight="700" letter-spacing="3.2" fill="#6f84a8">DESKTOP · EGUI</text>
    <text x="60" y="86" font-size="23" font-weight="700" fill="#e8f0ff">Темы, просмотр из контейнера, безопасное удаление</text>
    <text x="60" y="112" font-size="13.5" fill="#8ea3c8">Midnight / Neon / Light · RU / EN · Argon2id · Windows / macOS / Linux</text>

    <!-- window -->
    <g transform="translate(70 140)">
      <rect x="0" y="0" width="1060" height="556" rx="18" fill="#080b10" stroke="#22304a" stroke-width="1.5"/>
      <rect x="0" y="0" width="1060" height="38" rx="18" fill="#0d121a"/>
      <rect x="0" y="19" width="1060" height="19" fill="#0d121a"/>
      <circle cx="24" cy="19" r="5.5" fill="#ff5f57"/>
      <circle cx="43" cy="19" r="5.5" fill="#febc2e"/>
      <circle cx="62" cy="19" r="5.5" fill="#28c840"/>
      <text x="530" y="23" font-size="10.5" fill="#6f84a8" text-anchor="middle">SecretPiece</text>

      <!-- app header -->
      <rect x="24" y="54" width="42" height="42" rx="13" fill="#22d3ee"/>
      <text x="45" y="82" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">SP</text>
      <text x="78" y="76" font-size="20" font-weight="800" fill="#e8f0ff">SecretPiece</text>
      <text x="78" y="93" font-size="10.5" fill="#8b9bb0">зашифрованное хранилище · один файл</text>

      <text x="800" y="79" font-size="10.5" fill="#8b9bb0">Тема</text>

      <!-- swatch: light -->
      <rect x="838" y="60" width="24" height="24" rx="6" fill="#f7f8f8" stroke="#d4d8dd"/>
      <circle cx="846" cy="68" r="4" fill="#0e9aa7"/>
      <circle cx="854" cy="76" r="4" fill="#7c5cf0"/>

      <!-- swatch: neon -->
      <rect x="870" y="60" width="24" height="24" rx="6" fill="#140a24" stroke="#3b2a55"/>
      <circle cx="878" cy="68" r="4" fill="#f472b6"/>
      <circle cx="886" cy="76" r="4" fill="#22d3ee"/>

      <!-- swatch: midnight (active) -->
      <rect x="904" y="62" width="24" height="24" rx="6" fill="#080b10" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="912" cy="70" r="4" fill="#22d3ee"/>
      <circle cx="920" cy="78" r="4" fill="#a78bfa"/>

      <!-- language switch -->
      <rect x="944" y="58" width="84" height="30" rx="9" fill="#131a26" stroke="#22304a"/>
      <rect x="948" y="62" width="34" height="22" rx="6" fill="#22d3ee"/>
      <text x="965" y="77" font-size="10.5" font-weight="700" fill="#080b10" text-anchor="middle">RU</text>
      <text x="1002" y="77" font-size="10.5" fill="#8b9bb0" text-anchor="middle">EN</text>

      <rect x="0" y="110" width="1060" height="2" fill="url(#accent)"/>

      <!-- content background glow -->
      <ellipse cx="120" cy="140" rx="420" ry="330" fill="url(#glowCyan)"/>
      <ellipse cx="1010" cy="520" rx="340" ry="250" fill="url(#glowViolet)"/>

      <!-- hero -->
      <rect x="510" y="118" width="40" height="40" rx="12" fill="#22d3ee"/>
      <text x="530" y="144" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">SP</text>
      <text x="530" y="182" font-size="22" font-weight="800" fill="#e8f0ff" text-anchor="middle">SecretPiece</text>
      <text x="530" y="199" font-size="11" fill="#8b9bb0" text-anchor="middle">Ваш секрет — в кусочках. Один файл, ноль следов на диске.</text>

      <!-- unlock card -->
      <g>
        <rect x="320" y="210" width="420" height="300" rx="20" fill="url(#card)" stroke="#22304a"/>
        <rect x="340" y="228" width="380" height="3" rx="1.5" fill="url(#accent)"/>

        <text x="530" y="250" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="#22d3ee" text-anchor="middle">ВХОД</text>
        <text x="530" y="274" font-size="21" font-weight="800" fill="#e8f0ff" text-anchor="middle">Открыть хранилище</text>
        <text x="530" y="291" font-size="10.5" fill="#8b9bb0" text-anchor="middle">Пароль не покидает это устройство · Argon2id</text>

        <text x="340" y="313" font-size="10" fill="#8b9bb0">Файл хранилища</text>
        <rect x="340" y="319" width="278" height="32" rx="8" fill="#0a0e14" stroke="#3a4657"/>
        <text x="352" y="340" font-size="11" fill="#e8f0ff" font-family="ui-monospace, Menlo, Consolas, monospace">D:\vaults\personal.spv</text>
        <rect x="626" y="319" width="94" height="32" rx="8" fill="#131a26" stroke="#3a4657"/>
        <text x="673" y="340" font-size="10.5" fill="#e8f0ff" text-anchor="middle">Обзор…</text>
        <text x="340" y="367" font-size="9" fill="#6f84a8">Любой файл: .spv, .bin, .mp3 — внутри всё равно контейнер SPV1.</text>

        <text x="340" y="386" font-size="10" fill="#8b9bb0">Пароль</text>
        <rect x="340" y="392" width="278" height="32" rx="8" fill="#0a0e14" stroke="#3a4657"/>
        <text x="352" y="413" font-size="11" fill="#e8f0ff">••••••••••••</text>
        <rect x="626" y="392" width="94" height="32" rx="8" fill="#131a26" stroke="#3a4657"/>
        <text x="673" y="413" font-size="10.5" fill="#8b9bb0" text-anchor="middle">Показать</text>

        <rect x="340" y="436" width="380" height="38" rx="10" fill="#22d3ee"/>
        <text x="530" y="460" font-size="13" font-weight="800" fill="#080b10" text-anchor="middle">Открыть</text>
        <text x="530" y="494" font-size="10.5" fill="#a78bfa" text-anchor="middle">Создать новое хранилище</text>
      </g>

      <!-- feature chips -->
      <g font-size="9" text-anchor="middle">
        <rect x="360" y="522" width="88" height="22" rx="7" fill="#131a26" stroke="#22304a"/>
        <text x="404" y="537" fill="#22d3ee">Argon2id</text>
        <rect x="456" y="522" width="142" height="22" rx="7" fill="#131a26" stroke="#22304a"/>
        <text x="527" y="537" fill="#a78bfa">XChaCha20-Poly1305</text>
        <rect x="606" y="522" width="74" height="22" rx="7" fill="#131a26" stroke="#22304a"/>
        <text x="643" y="537" fill="#4ade80">BLAKE3</text>
      </g>

      <!-- preview dialog -->
      <g>
        <rect x="748" y="250" width="300" height="176" rx="12" fill="#0d121a" stroke="#2b3a50"/>
        <rect x="748" y="250" width="300" height="32" rx="12" fill="#1a2433"/>
        <rect x="748" y="270" width="300" height="12" fill="#1a2433"/>
        <text x="764" y="271" font-size="10.5" font-weight="700" fill="#e8f0ff">Просмотр из контейнера</text>
        <text x="1032" y="271" font-size="12" fill="#8b9bb0" text-anchor="middle">×</text>
        <text x="764" y="301" font-size="8.5" fill="#8b9bb0">docs/readme.md · 25.2 KiB</text>
        <rect x="764" y="308" width="268" height="102" rx="6" fill="#0a0e14"/>
        <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#9fb0c6">
          <text x="774" y="323">&lt;p align="center"&gt;</text>
          <text x="774" y="337">&lt;img src="docs/assets/hero.svg"</text>
          <text x="774" y="351">alt="SecretPiece" width="100%"&gt;</text>
          <text x="774" y="365">&lt;/p&gt;</text>
          <text x="774" y="381">&lt;a href="README.md"&gt;Русский&lt;/a&gt;</text>
          <text x="774" y="395">&lt;a href="README.en.md"&gt;English&lt;/a&gt;</text>
        </g>
      </g>
    </g>

    <text x="600" y="716" font-size="11" fill="#6f84a8" text-anchor="middle">три темы · выбор запоминается · текст и hex читаются из контейнера в RAM</text>
  </g>
</svg>
