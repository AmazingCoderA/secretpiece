<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="SecretPiece architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.6" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a30"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de8ff"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.16" cy="0.2" r="0.4">
      <stop offset="0" stop-color="#4de8ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4de8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.8" r="0.45">
      <stop offset="0" stop-color="#9b6bff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fb4ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5b7bb5"/>
    </marker>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="720" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="720" rx="24" fill="url(#glowA)"/>
  <rect width="1200" height="720" rx="24" fill="url(#glowB)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
    <text x="60" y="50" font-size="14" font-weight="700" letter-spacing="3" fill="#6b7c9e">ARCHITECTURE</text>

    <!-- interfaces -->
    <g>
      <rect x="60" y="68" width="200" height="74" rx="16" fill="#0f1728" stroke="#2a3b5c"/>
      <text x="160" y="101" font-size="20" font-weight="700" fill="#dfe9ff" text-anchor="middle">CLI</text>
      <text x="160" y="123" font-size="13" fill="#8093b8" text-anchor="middle">sp-cli</text>

      <rect x="280" y="68" width="200" height="74" rx="16" fill="#0f1728" stroke="#2a3b5c"/>
      <text x="380" y="101" font-size="20" font-weight="700" fill="#dfe9ff" text-anchor="middle">GUI</text>
      <text x="380" y="123" font-size="13" fill="#8093b8" text-anchor="middle">egui · eframe</text>

      <rect x="500" y="68" width="200" height="74" rx="16" fill="#0f1728" stroke="#2a3b5c"/>
      <text x="600" y="101" font-size="20" font-weight="700" fill="#dfe9ff" text-anchor="middle">FFI · SDK</text>
      <text x="600" y="123" font-size="13" fill="#8093b8" text-anchor="middle">JNI · Android reads</text>
    </g>

    <line x1="380" y1="146" x2="380" y2="186" stroke="#5b7bb5" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- vault -->
    <rect x="60" y="190" width="640" height="84" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.6"/>
    <text x="86" y="224" font-size="21" font-weight="700" fill="#e6efff">sp-vault</text>
    <text x="86" y="250" font-size="14" fill="#8ea3c8">create · open · put/get · list · verify · info</text>

    <line x1="380" y1="278" x2="380" y2="316" stroke="#5b7bb5" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- format -->
    <rect x="60" y="320" width="640" height="94" rx="18" fill="url(#card)" stroke="#2f4a74" stroke-width="1.4"/>
    <text x="86" y="354" font-size="21" font-weight="700" fill="#e6efff">sp-format · SPV1</text>
    <text x="86" y="378" font-size="14" fill="#8ea3c8">2 × 4 KiB header slots · wrapped master key · encrypted JSON index · generations</text>
    <text x="86" y="400" font-size="13" fill="#6f84a8">format_version · argon2id params · index offset · blake3 checksum</text>

    <line x1="380" y1="418" x2="380" y2="456" stroke="#5b7bb5" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- fs / storage -->
    <rect x="60" y="460" width="310" height="84" rx="18" fill="url(#card)" stroke="#2f4a74" stroke-width="1.4"/>
    <text x="86" y="494" font-size="19" font-weight="700" fill="#e6efff">sp-fs</text>
    <text x="86" y="518" font-size="13" fill="#8ea3c8">paths · extents · versions</text>
    <text x="86" y="536" font-size="12" fill="#6f84a8">snapshots · trash · refcounts</text>

    <rect x="390" y="460" width="310" height="84" rx="18" fill="url(#card)" stroke="#2f4a74" stroke-width="1.4"/>
    <text x="416" y="494" font-size="19" font-weight="700" fill="#e6efff">sp-storage</text>
    <text x="416" y="518" font-size="13" fill="#8ea3c8">chunks · parts · locks</text>
    <text x="416" y="536" font-size="12" fill="#6f84a8">fsync · FAT32 split · random access</text>

    <line x1="380" y1="548" x2="380" y2="586" stroke="#5b7bb5" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- crypto -->
    <rect x="60" y="590" width="640" height="84" rx="18" fill="#101a30" stroke="#4de8ff" stroke-opacity="0.5" stroke-width="1.4"/>
    <text x="86" y="624" font-size="21" font-weight="700" fill="#bfefff">sp-crypto</text>
    <text x="86" y="650" font-size="13" fill="#8ecfe8">Argon2id · XChaCha20-Poly1305 · BLAKE3 · zeroizing keys</text>

    <!-- right: container -->
    <text x="780" y="50" font-size="14" font-weight="700" letter-spacing="3" fill="#6b7c9e">SPV1 ON DISK</text>
    <text x="780" y="72" font-size="16" fill="#c9d8f5">USB · HDD · SSD · network folder</text>

    <rect x="760" y="92" width="380" height="582" rx="20" fill="#0c1322" stroke="#26375a" stroke-width="1.4"/>
    <text x="950" y="120" font-size="15" font-weight="700" fill="#dbe6ff" text-anchor="middle">personal.spv</text>
    <text x="950" y="140" font-size="12" fill="#6f84a8" text-anchor="middle">one ordinary file · 8 GiB</text>

    <!-- outer area -->
    <rect x="784" y="156" width="332" height="176" rx="12" fill="#0f1a2f" stroke="#2b4675" stroke-dasharray="4 4"/>
    <text x="800" y="176" font-size="12" font-weight="700" fill="#7fb2ff">SPV1 HEADERS</text>
    <rect x="800" y="186" width="300" height="26" rx="6" fill="#16233d"/>
    <text x="812" y="204" font-size="12" fill="#a9c0e8">header slot 0 · 4096 B</text>
    <rect x="800" y="218" width="300" height="26" rx="6" fill="#16233d"/>
    <text x="812" y="236" font-size="12" fill="#a9c0e8">header slot 1 · 4096 B</text>
    <rect x="800" y="250" width="300" height="64" rx="6" fill="#13203a"/>
    <text x="812" y="270" font-size="12" fill="#a9c0e8">encrypted index + chunks</text>
    <text x="812" y="290" font-size="11" fill="#6f84a8">files · paths · 64 KiB chunks</text>

    <!-- free space -->
    <rect x="784" y="342" width="332" height="66" rx="12" fill="#0d1626" stroke="#31456b" stroke-dasharray="4 4"/>
    <text x="800" y="364" font-size="12" font-weight="700" fill="#8ea3c8">DATA AREA</text>
    <text x="800" y="386" font-size="11" fill="#6f84a8">authenticated chunks · path + index in AAD</text>

    <!-- hidden -->
    <rect x="784" y="418" width="332" height="126" rx="12" fill="#1a1533" stroke="#7c5cff" stroke-dasharray="5 4"/>
    <text x="800" y="440" font-size="12" font-weight="700" fill="#b9a4ff">HIDDEN VOLUME · PLANNED</text>
    <rect x="800" y="450" width="300" height="24" rx="6" fill="#241c47"/>
    <text x="812" y="467" font-size="11" fill="#cbb8ff">not in v1.4</text>
    <rect x="800" y="480" width="300" height="50" rx="6" fill="#201942"/>
    <text x="812" y="500" font-size="11" fill="#cbb8ff">separate key + separate index</text>
    <text x="812" y="518" font-size="10" fill="#9a86d6">planned for v1.7</text>

    <text x="950" y="562" font-size="11" fill="#6f84a8" text-anchor="middle">no partitions · no drivers · no admin rights</text>

    <!-- footer chips -->
    <g font-size="12" font-weight="600">
      <rect x="60" y="688" width="150" height="24" rx="12" fill="#4de8ff" fill-opacity="0.08" stroke="#4de8ff" stroke-opacity="0.25"/>
      <text x="135" y="704" fill="#8fe9ff" text-anchor="middle">AEAD per chunk</text>
      <rect x="222" y="688" width="172" height="24" rx="12" fill="#6ea8ff" fill-opacity="0.08" stroke="#6ea8ff" stroke-opacity="0.25"/>
      <text x="308" y="704" fill="#a8c8ff" text-anchor="middle">atomic commits</text>
      <rect x="406" y="688" width="164" height="24" rx="12" fill="#9b6bff" fill-opacity="0.10" stroke="#9b6bff" stroke-opacity="0.30"/>
      <text x="488" y="704" fill="#c6b0ff" text-anchor="middle">crypto-erase</text>
    </g>
  </g>
</svg>
